name: Android CI — build & sign release APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Generate release signing keystore (CI only)
        run: |
          # If a real keystore is provided via secrets, use it; otherwise create a
          # throwaway CI keystore so the artifact remains installable & verifiable.
          if [ -n "${{ secrets.WHALERT_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.WHALERT_KEYSTORE_B64 }}" | base64 -d > /tmp/release.keystore
            echo "WHALERT_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "WHALERT_KEYSTORE_PASSWORD=${{ secrets.WHALERT_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "WHALERT_KEY_ALIAS=${{ secrets.WHALERT_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "WHALERT_KEY_PASSWORD=${{ secrets.WHALERT_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore /tmp/ci.keystore \
              -alias whalert-ci -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass ci-only-password -keypass ci-only-password \
              -dname "CN=WhAlert CI, OU=CI, O=CI, L=CI, ST=CI, C=FR"
            echo "WHALERT_KEYSTORE_PATH=/tmp/ci.keystore" >> $GITHUB_ENV
            echo "WHALERT_KEYSTORE_PASSWORD=ci-only-password" >> $GITHUB_ENV
            echo "WHALERT_KEY_ALIAS=whalert-ci" >> $GITHUB_ENV
            echo "WHALERT_KEY_PASSWORD=ci-only-password" >> $GITHUB_ENV
          fi

      - name: Optional backend URL (HTTPS only, no default fictional backend)
        run: |
          if [ -n "${{ vars.WHALERT_API_BASE_URL }}" ]; then
            echo "WHALERT_API_BASE_URL=${{ vars.WHALERT_API_BASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhAlert-unit-test-reports
          path: app/build/reports/tests/

      - name: Android Lint (release)
        continue-on-error: true
        run: ./gradlew --no-daemon lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhAlert-lint-report
          path: app/build/reports/lint-results-release.html

      - name: Instrumentation compile check (no device required)
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Assemble release APK + AAB
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify APK (manifest, package, signature, size, hash)
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging "$APK" | head -8
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          unzip -l "$APK" | grep -E "classes.*\.dex|AndroidManifest" || true
          SIZE=$(stat -c%s "$APK"); echo "APK size bytes: $SIZE"
          [ "$SIZE" -le 943718400 ] || { echo "ERROR: APK exceeds 900 MB"; exit 1; }
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - name: Upload SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: WhAlert-apk-sha256
          path: /tmp/apk-sha256.txt

      - name: Upload app-release.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhAlert-app-release-apk
          path: ${{ env.APK }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhAlert-app-release-aab
          path: app/build/outputs/bundle/release/*.aab
